<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Performance Metrics — Sign In</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#f4f5f7;
         display:flex;align-items:center;justify-content:center;
         min-height:100vh;padding:20px}

    .card{background:#fff;border-radius:8px;padding:40px;
          width:100%;max-width:420px;
          box-shadow:0 4px 20px rgba(0,0,0,.1)}

    .logo{text-align:center;margin-bottom:28px}
    .logo h1{font-size:22px;font-weight:700;color:#0052cc}
    .logo p{font-size:13px;color:#6b778c;margin-top:4px}

    .tabs{display:flex;border-bottom:2px solid #dfe1e6;margin-bottom:24px}
    .tab{flex:1;padding:10px;text-align:center;cursor:pointer;
         font-size:14px;font-weight:500;color:#6b778c;
         border-bottom:3px solid transparent;margin-bottom:-2px;
         transition:color .15s,border-color .15s;background:none;border-top:none;
         border-left:none;border-right:none}
    .tab.active{color:#0052cc;border-bottom-color:#0052cc}
    .tab-pane{display:none}
    .tab-pane.active{display:block}

    .field{margin-bottom:16px}
    label{display:block;font-size:13px;font-weight:500;
          color:#172b4d;margin-bottom:6px}
    input,select{width:100%;padding:10px 12px;border:1px solid #dfe1e6;
                 border-radius:4px;font-size:14px;font-family:inherit;
                 color:#172b4d;background:#fafbfc;
                 transition:border-color .15s}
    input:focus,select:focus{outline:none;border-color:#0052cc;
                              background:#fff;
                              box-shadow:0 0 0 2px rgba(0,82,204,.1)}

    .btn{width:100%;padding:11px;background:#0052cc;color:#fff;
         border:none;border-radius:4px;font-size:15px;font-weight:600;
         cursor:pointer;transition:background .15s;margin-top:8px}
    .btn:hover{background:#0065ff}
    .btn:disabled{background:#a5adba;cursor:not-allowed}

    .error{background:#ffebe6;color:#bf2600;padding:10px 12px;
           border-radius:4px;font-size:13px;margin-top:12px;display:none}
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>📊 Performance Metrics</h1>
    <p>Track your engineering performance</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabSignIn"
            onclick="switchTab('signin')">Sign In</button>
    <button class="tab" id="tabSignUp"
            onclick="switchTab('signup')">Sign Up</button>
  </div>

  <!-- ── Sign In ── -->
  <div id="paneSignIn" class="tab-pane active">
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail"
             placeholder="you@company.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPwd"
             placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div class="error" id="loginErr"></div>
  </div>

  <!-- ── Sign Up ── -->
  <div id="paneSignUp" class="tab-pane">
    <div class="field">
      <label>Display Name</label>
      <input type="text" id="regName" placeholder="Jane Smith"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="regEmail"
             placeholder="you@company.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password <span style="color:#6b778c;font-weight:400">(min 6 chars)</span></label>
      <input type="password" id="regPwd"
             placeholder="••••••••" autocomplete="new-password"/>
    </div>
    <div class="field">
      <label>Role</label>
      <select id="regRole">
        <option value="SDET">SDET</option>
        <option value="SDE">SDE</option>
        <option value="Manager">Manager</option>
      </select>
    </div>
    <button class="btn" id="regBtn" onclick="doRegister()">
      Create Account
    </button>
    <div class="error" id="regErr"></div>
  </div>
</div>

<script>
  // Already logged in? Go straight to dashboard
  if (localStorage.getItem('token')) location.href = '/dashboard';

  function switchTab(tab) {
    const isSignIn = tab === 'signin';
    document.getElementById('tabSignIn').classList.toggle('active',  isSignIn);
    document.getElementById('tabSignUp').classList.toggle('active', !isSignIn);
    document.getElementById('paneSignIn').classList.toggle('active',  isSignIn);
    document.getElementById('paneSignUp').classList.toggle('active', !isSignIn);
  }

  // ── Login ──────────────────────────────────────────────────────────────
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd   = document.getElementById('loginPwd').value;
    const err   = document.getElementById('loginErr');
    const btn   = document.getElementById('loginBtn');

    err.style.display = 'none';
    if (!email || !pwd) {
      err.textContent   = 'Please enter your email and password.';
      err.style.display = 'block';
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Signing in…';

    try {
      const r = await fetch('/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password: pwd }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Login failed');
      localStorage.setItem('token', data.access_token);
      location.href = '/dashboard';
    } catch (e) {
      err.textContent   = '❌ ' + e.message;
      err.style.display = 'block';
      btn.disabled      = false;
      btn.textContent   = 'Sign In';
    }
  }

  // ── Register ───────────────────────────────────────────────────────────
  async function doRegister() {
    const name  = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pwd   = document.getElementById('regPwd').value;
    const role  = document.getElementById('regRole').value;
    const err   = document.getElementById('regErr');
    const btn   = document.getElementById('regBtn');

    err.style.display = 'none';

    if (!name || !email || !pwd) {
      err.textContent   = 'Please fill in all fields.';
      err.style.display = 'block';
      return;
    }
    if (pwd.length < 6) {
      err.textContent   = 'Password must be at least 6 characters.';
      err.style.display = 'block';
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Creating account…';

    try {
      const r = await fetch('/auth/register', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          email, password: pwd, display_name: name, role,
        }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Registration failed');
      localStorage.setItem('token', data.access_token);
      location.href = '/dashboard';
    } catch (e) {
      err.textContent   = '❌ ' + e.message;
      err.style.display = 'block';
      btn.disabled      = false;
      btn.textContent   = 'Create Account';
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const active = document.querySelector('.tab-pane.active').id;
    if (active === 'paneSignIn') doLogin();
    else doRegister();
  });
</script>
</body>
</html>
