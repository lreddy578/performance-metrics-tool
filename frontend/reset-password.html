<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Performance Metrics — Reset Password</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;
         color:#172b4d;min-height:100vh;display:flex;
         align-items:center;justify-content:center;padding:20px}

    .card{background:#fff;border-radius:12px;padding:36px 40px;
          width:100%;max-width:420px;
          box-shadow:0 4px 24px rgba(0,0,0,.1)}

    .logo{text-align:center;margin-bottom:28px}
    .logo .icon{font-size:44px}
    .logo h1{font-size:20px;font-weight:700;margin-top:10px}
    .logo p{color:#6b778c;font-size:13px;margin-top:6px}

    .field{margin-bottom:16px}
    .field label{display:block;font-size:13px;font-weight:600;
                 margin-bottom:6px}
    .field input{width:100%;padding:11px 14px;border:1px solid #dfe1e6;
                 border-radius:6px;font-size:14px;font-family:inherit;
                 color:#172b4d;background:#fff;transition:border-color .15s}
    .field input:focus{outline:none;border-color:#0052cc;
                       box-shadow:0 0 0 2px rgba(0,82,204,.12)}

    .btn{width:100%;padding:12px;border:none;border-radius:6px;
         cursor:pointer;font-size:15px;font-weight:600;
         background:#0052cc;color:#fff;
         transition:background .15s,opacity .15s;
         display:flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover:not(:disabled){background:#0065ff}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn-success{background:#36b37e}
    .btn-success:hover:not(:disabled){background:#2d9c6b}

    .alert{padding:11px 14px;border-radius:6px;font-size:13px;
           margin-bottom:16px;line-height:1.5}
    .alert-err {background:#ffebe6;color:#bf2600;
                border-left:4px solid #de350b}
    .alert-ok  {background:#e3fcef;color:#006644;
                border-left:4px solid #36b37e}

    .pw-strength{height:4px;border-radius:2px;
                 margin-top:6px;background:#dfe1e6;transition:all .3s}
    .pw-strength.weak  {background:#de350b;width:30%}
    .pw-strength.fair  {background:#ff991f;width:60%}
    .pw-strength.strong{background:#36b37e;width:100%}
    .pw-strength-lbl{font-size:11px;color:#6b778c;margin-top:4px}

    /* Loading/error full-screen state */
    #tokenCheck{text-align:center;color:#6b778c;font-size:14px;padding:20px 0}
    .loading-spinner{font-size:28px;margin-bottom:12px}
  </style>
</head>
<body>
<div class="card">

  <div class="logo">
    <div class="icon">🔑</div>
    <h1>Reset Your Password</h1>
    <p>Performance Metrics Tool</p>
  </div>

  <!-- Token validation state -->
  <div id="tokenCheck">
    <div class="loading-spinner">⏳</div>
    Validating reset link…
  </div>

  <!-- Invalid token state -->
  <div id="invalidToken" style="display:none">
    <div class="alert alert-err">
      ❌ <strong>Invalid or expired reset link.</strong><br/>
      This link may have already been used or has expired (1 hour limit).
    </div>
    <a href="/login"
       style="display:block;text-align:center;margin-top:12px;
              color:#0052cc;font-size:13px;text-decoration:none">
      ← Back to Sign In
    </a>
  </div>

  <!-- Reset form (shown after token validated) -->
  <div id="resetForm" style="display:none">
    <div id="formAlert"></div>
    <div class="field">
      <label>New Password <span style="color:#de350b">*</span></label>
      <input type="password" id="newPwd"
             placeholder="Min 4 characters"
             oninput="checkStrength(this.value)"
             onkeydown="if(event.key==='Enter')submitReset()"/>
      <div class="pw-strength" id="pwStrength"></div>
      <div class="pw-strength-lbl" id="pwStrengthLbl"></div>
    </div>
    <div class="field">
      <label>Confirm New Password <span style="color:#de350b">*</span></label>
      <input type="password" id="confirmPwd"
             placeholder="Re-enter password"
             onkeydown="if(event.key==='Enter')submitReset()"/>
    </div>
    <button class="btn btn-success" id="resetBtn"
            onclick="submitReset()">
      ✅ Set New Password
    </button>
    <div style="text-align:center;margin-top:14px">
      <a href="/login"
         style="font-size:12px;color:#6b778c;text-decoration:none">
        ← Back to Sign In
      </a>
    </div>
  </div>

  <!-- Success state -->
  <div id="successState" style="display:none">
    <div class="alert alert-ok">
      🎉 <strong>Password updated successfully!</strong><br/>
      You can now log in with your new password.
    </div>
    <a href="/login">
      <button class="btn" style="margin-top:8px">
        🔐 Go to Sign In
      </button>
    </a>
  </div>

</div>

<script>
  // Read token from URL ?token=xxx
  const params = new URLSearchParams(window.location.search)
  const TOKEN  = params.get('token')

  // Validate token on page load
  ;(async () => {
    if (!TOKEN) {
      showState('invalid')
      return
    }
    try {
      const r = await fetch(
        `/api/auth/validate-reset-token/${encodeURIComponent(TOKEN)}`)
      if (!r.ok) throw new Error('invalid')
      showState('form')
    } catch {
      showState('invalid')
    }
  })()

  /* ── Submit new password ── */
  async function submitReset() {
    const newPwd     = document.getElementById('newPwd').value
    const confirmPwd = document.getElementById('confirmPwd').value

    if (!newPwd || newPwd.length < 4) {
      showAlert('formAlert','err','⚠️ Password must be at least 4 characters.')
      return
    }
    if (newPwd !== confirmPwd) {
      showAlert('formAlert','err','⚠️ Passwords do not match.')
      return
    }
    const btn = startLoading('resetBtn','Updating…')
    try {
      await post('/api/auth/reset-password',
                 { token: TOKEN, password: newPwd })
      showState('success')
    } catch(e) {
      showAlert('formAlert','err','❌ ' + errMsg(e))
    } finally {
      stopLoading(btn, '✅ Set New Password')
    }
  }

  /* ── UI state manager ── */
  function showState(state) {
    document.getElementById('tokenCheck').style.display  =
      state === 'loading' ? '' : 'none'
    document.getElementById('invalidToken').style.display =
      state === 'invalid' ? '' : 'none'
    document.getElementById('resetForm').style.display    =
      state === 'form'    ? '' : 'none'
    document.getElementById('successState').style.display =
      state === 'success' ? '' : 'none'
  }

  /* ── Password strength ── */
  function checkStrength(pw) {
    const bar = document.getElementById('pwStrength')
    const lbl = document.getElementById('pwStrengthLbl')
    if (!pw) { bar.className = 'pw-strength'; lbl.textContent = ''; return }
    const score = [
      pw.length >= 8,
      /[A-Z]/.test(pw),
      /[a-z]/.test(pw),
      /[0-9]/.test(pw),
      /[^A-Za-z0-9]/.test(pw)
    ].filter(Boolean).length
    if (score <= 2) {
      bar.className = 'pw-strength weak'
      lbl.textContent = '🔴 Weak password'
    } else if (score <= 3) {
      bar.className = 'pw-strength fair'
      lbl.textContent = '🟡 Fair password'
    } else {
      bar.className = 'pw-strength strong'
      lbl.textContent = '🟢 Strong password'
    }
  }

  /* ── Helpers ── */
  function showAlert(id, type, msg) {
    document.getElementById(id).innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`
  }
  function errMsg(e) {
    return typeof e?.message === 'string' ? e.message : String(e||'Unknown error')
  }
  function startLoading(btnId, txt) {
    const b = document.getElementById(btnId)
    b._orig = b.textContent; b.disabled = true; b.textContent = txt
    return b
  }
  function stopLoading(b, orig) {
    b.disabled = false; b.textContent = orig || b._orig
  }
  async function post(url, body) {
    const r = await fetch(url, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
    })
    const d = await r.json()
    if (!r.ok) throw new Error(d.detail || 'Request failed')
    return d
  }
</script>
</body>
</html>
